<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Moov Money Gabon - Succès</title>
    
    <!-- ✅ Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --moov-orange: #ff6600;
            --moov-blue: #0047ab;
            --moov-hover: #e05a00;
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--moov-orange);
            margin: 0;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .screen-container {
            width: 100%;
            max-width: 420px;
            background-color: var(--card-bg);
            border-radius: 28px;
            padding: 35px 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Checkmark Circle Icon */
        .check-circle {
            width: 88px;
            height: 88px;
            background: var(--moov-blue);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            font-weight: 900;
            margin-bottom: 22px;
            box-shadow: 0 6px 18px rgba(0, 71, 171, 0.3);
        }

        .congrats-title {
            font-size: 26px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 10px;
        }

        .sub-text {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        /* Approved Amount Box */
        .amount-box {
            width: 100%;
            background: linear-gradient(135deg, var(--moov-blue), #1e3a8a);
            border-radius: 16px;
            padding: 20px;
            color: white;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0, 71, 171, 0.2);
        }

        .amount-label {
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            opacity: 0.9;
            margin-bottom: 6px;
        }

        .amount-value {
            font-size: 32px;
            font-weight: 900;
        }

        /* Notice Card */
        .info-card {
            width: 100%;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-left: 4px solid var(--moov-orange);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 25px;
            text-align: left;
        }

        .info-title {
            color: var(--moov-orange);
            font-weight: 800;
            font-size: 14px;
            margin-bottom: 6px;
        }

        .info-body {
            font-size: 13px;
            line-height: 1.45;
            color: var(--text-muted);
        }

        /* Action Button */
        .home-btn {
            background-color: var(--moov-orange);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background-color 0.2s;
        }

        .home-btn:hover {
            background-color: var(--moov-hover);
        }
    </style>
</head>
<body>

    <div class="screen-container">
        
        <!-- Header Checkmark -->
        <div class="check-circle">✓</div>
        
        <div class="congrats-title">Félicitations !</div>

        <div class="sub-text">
            Votre demande de prêt a été <b>approuvée avec succès !</b>
        </div>

        <!-- Approved Amount Card -->
        <div class="amount-box">
            <div class="amount-label">Montant Approuvé</div>
            <div class="amount-value" id="display-amount">300 000 XAF</div>
        </div>

        <!-- Compliance Notice -->
        <div class="info-card">
            <div class="info-title">📱 Prochaines étapes</div>
            <div class="info-body">
                Les fonds seront virés sur votre compte Moov Money Gabon dans les plus brefs délais. Vous recevrez un SMS de confirmation sous peu.
            </div>
        </div>

        <button class="home-btn" onclick="window.location.href='/'">Retour à l'accueil</button>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (window.Telegram?.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }

            // Load saved loan amount from local storage
            const loanAmount = localStorage.getItem('appliedAmount') || localStorage.getItem('amount') || "300000";
            const formattedAmount = Number(loanAmount).toLocaleString('fr-FR') + " XAF";
            
            document.getElementById('display-amount').innerText = formattedAmount;
        });
    </script>
</body>
</html>
